# ضعه في .github/workflows/keystore.yml ثم شغّله يدوياً مرة واحدة لإنشاء مفتاح التوقيع
name: Create Keystore
on: workflow_dispatch
jobs:
  ks:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.jks -alias dream -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Dream College, O=Dream College, C=SD"
          { echo "KEYSTORE_PASSWORD=$PASS"; echo "KEY_PASSWORD=$PASS"; echo "KEY_ALIAS=dream"; echo "KEYSTORE_BASE64:"; base64 -w0 release.jks; echo; } > keystore-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            release.jks
            keystore-info.txt
